specVersion: 0.0.5
schema:
  file: ../schema.graphql
description: Amana Vaults on BSC network

dataSources:
  - kind: ethereum
    name: VenusUSDT_BSC
    network: bsc
    source:
      address: "0xE054cD48ACd0F1433BE0293F9488AF1924Bb15EA"
      abi: AmanaVault
      startBlock: 28450278
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultDayData
      abis:
        - name: AmanaVault
          file: ../abis/AmanaVault.json
      eventHandlers:
        - event: VaultInitialized(uint8,uint256)
          handler: handleVaultInitialized
        - event: StrategyUpdated(indexed address)
          handler: handleStrategyUpdated
        - event: Deposited(indexed address,uint256,uint256,indexed bytes32)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256,indexed bytes32)
          handler: handleWithdrawn
      file: ../src/bscMapping.ts
      blockHandlers:
        - handler: handleBlock
          interval: 6500 