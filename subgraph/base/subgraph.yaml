specVersion: 0.0.5
schema:
  file: ../schema.graphql
description: Amana Vaults on Base network

dataSources:
  - kind: ethereum
    name: EulerUSDC_Base
    network: base
    source:
      address: "0xC967154127af55cecC47328B06385EFd8f8C427E"
      abi: AmanaVault
      startBlock: 28450278
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultDayData
      abis:
        - name: AmanaVault
          file: ../abis/AmanaVault.json
      eventHandlers:
        - event: VaultInitialized(uint8,uint256)
          handler: handleVaultInitialized
        - event: StrategyUpdated(indexed address)
          handler: handleStrategyUpdated
        - event: Deposited(indexed address,uint256,uint256,indexed bytes32)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256,indexed bytes32)
          handler: handleWithdrawn
      file: ../src/baseMapping.ts
      blockHandlers:
        - handler: handleBlock 