type Vault @entity(immutable: false) {
  "The vault contract address"
  id: ID!

  "ERC20 name()"
  name: String!

  "ERC20 symbol()"
  symbol: String!

  "Vault type (Lending Pool, Liquidity Pool, etc.)"
  type: String

  "Vault description"
  description: String

  "Vault image URL"
  imgURL: String

  "Whether deposit fee is paid from gas tank"
  depositFeePaidFromGasTank: Boolean!

  "Asset token address (underlying)"
  asset: Bytes!

  "Asset token symbol"
  assetSymbol: String!

  "Asset token decimals"
  assetDecimals: Int!

  "Asset token image URL"
  assetImgURL: String

  "Asset token price in USD"
  assetPrice: BigDecimal

  "Decimals for share token"
  decimals: Int!

  "Current strategy address"
  strategy: Bytes

  "Network where the strategy operates (Base, Ethereum, Polygon, etc.)"
  strategyNetwork: String

  "Strategy chain ID"
  strategyChainId: Int

  "Protocol name (Aave, Curve, etc.)"
  protocolName: String

  "Protocol image URL"
  protocolImgURL: String

  "Protocol description"
  protocolDescription: String

  "Network description"
  networkDescription: String

  "Rewards contract address (optional)"
  rewardsContractAddress: Bytes

  "Treasury receiving performance fees"
  treasury: Bytes

  "Performance fee (basis points) set at init"
  perfFee: BigInt!

  "Block number when the vault was initialised"
  createdAtBlock: BigInt!

  "Timestamp when the vault was initialised"
  createdAtTimestamp: BigInt!

  "Current total underlying assets in the vault"
  tvl: BigInt!

  "Total deposited (lifetime)"
  totalDeposited: BigInt!

  "Total withdrawn (lifetime)"
  totalWithdrawn: BigInt!

  "Current supply of vault share tokens"
  sharesSupply: BigInt!

  "Current price per share (totalAssets/totalSupply)"
  pricePerShare: BigDecimal!

  "Annualised APY based on 7-day price per share change"
  apy7d: BigDecimal!

  "30-day APY (optional)"
  apy30d: BigDecimal

  "Risk level (1-5 scale)"
  riskLevel: Int

  "All user positions in this vault"
  userPositions: [UserPosition!]! @derivedFrom(field: "vault")

  "All deposits to this vault"
  deposits: [Deposit!]! @derivedFrom(field: "vault")

  "All withdrawals from this vault"
  withdrawals: [Withdrawal!]! @derivedFrom(field: "vault")
}

"User position in a specific vault"
type UserPosition @entity(immutable: false) {
  "vault-user"
  id: ID!

  "The vault"
  vault: Vault!

  "User address"
  user: Bytes!

  "Current shares balance"
  sharesBalance: BigInt!

  "Current assets balance (converted from shares)"
  assetsBalance: BigInt!

  "Total amount deposited by user (lifetime)"
  totalDeposited: BigInt!

  "Total amount withdrawn by user (lifetime)"
  totalWithdrawn: BigInt!

  "Total shares received by user (lifetime)"
  totalSharesReceived: BigInt!

  "Total shares redeemed by user (lifetime)"
  totalSharesRedeemed: BigInt!

  "First deposit timestamp"
  firstDepositAt: BigInt!

  "Last interaction timestamp"
  lastInteractionAt: BigInt!

  "Number of deposits"
  depositCount: Int!

  "Number of withdrawals"
  withdrawalCount: Int!
}

"Individual deposit transaction"
type Deposit @entity(immutable: true) {
  "tx-hash-log-index"
  id: ID!

  "The vault"
  vault: Vault!

  "User who deposited"
  user: Bytes!

  "Amount of assets deposited"
  amount: BigInt!

  "Shares received"
  shares: BigInt!

  "Vault nonce (or cross-chain transaction ID in older version)"
  vaultNonce: BigInt!

  "Block number"
  blockNumber: BigInt!

  "Block timestamp"
  timestamp: BigInt!

  "Transaction hash"
  transactionHash: Bytes!

  "Price per share at deposit time"
  pricePerShare: BigDecimal!
}

"Individual withdrawal transaction"
type Withdrawal @entity(immutable: true) {
  "tx-hash-log-index"
  id: ID!

  "The vault"
  vault: Vault!

  "User who withdrew"
  user: Bytes!

  "Amount of assets withdrawn"
  amount: BigInt!

  "Shares redeemed"
  shares: BigInt!

  "Vault nonce (or cross-chain transaction ID in older version)"
  vaultNonce: BigInt!

  "Block number"
  blockNumber: BigInt!

  "Block timestamp"
  timestamp: BigInt!

  "Transaction hash"
  transactionHash: Bytes!

  "Price per share at withdrawal time"
  pricePerShare: BigDecimal!
}

"Daily aggregate stats for each vault"
type VaultDayData @entity(immutable: false) {
  id: ID!
  vault: Vault!
  date: Int!
  sharesSupply: BigInt!
  tvl: BigInt!
  dailyDeposit: BigInt!
  dailyWithdraw: BigInt!
  pricePerShare: BigDecimal!
  uniqueDepositors: Int!
  uniqueWithdrawers: Int!
  depositCount: Int!
  withdrawalCount: Int!
}

"Daily aggregate stats for each user position"
type UserPositionDayData @entity(immutable: false) {
  "vault-user-day"
  id: ID!
  
  "User position"
  userPosition: UserPosition!
  
  "Date (days since epoch)"
  date: Int!
  
  "Shares balance at end of day"
  sharesBalance: BigInt!
  
  "Assets balance at end of day"
  assetsBalance: BigInt!
  
  "Daily deposits"
  dailyDeposited: BigInt!
  
  "Daily withdrawals"
  dailyWithdrawn: BigInt!
  
  "Price per share at end of day"
  pricePerShare: BigDecimal!
} 