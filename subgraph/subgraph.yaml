specVersion: 0.0.5
schema:
  file: ./schema.graphql
description: Amana Vaults subgraph that indexes VaultInitialized and StrategyUpdated events to build the list of live vaults.

# Each vault lives on its own chain, so we create a distinct dataSource per network / address.

dataSources:
  - kind: ethereum
    name: ZeroLendUSDC_Vault
    network: zetachain
    source:
      address: "0x0F6514E3e4760eFc8f34fc67a05c4987367aF14e"
      abi: AmanaVault
      startBlock: 7192565
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: AmanaVault
          file: ./abis/AmanaVault.json
      eventHandlers:
        - event: VaultInitialized(uint8,uint256)
          handler: handleVaultInitialized
        - event: StrategyUpdated(indexed address)
          handler: handleStrategyUpdated
        - event: Deposited(indexed address,uint256,uint256,indexed uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256,indexed uint256)
          handler: handleWithdrawn
        - event: Deposited(indexed address,uint256,uint256,indexed bytes32)
          handler: handleDepositedLegacy
        - event: Withdrawn(indexed address,uint256,uint256,indexed bytes32)
          handler: handleWithdrawnLegacy
      file: ./src/mapping.ts

